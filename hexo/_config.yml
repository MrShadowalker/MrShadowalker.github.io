url: https://chenzihao.me
root: /
permalink: articles/:title.html
permalink_defaults:
  lang: zh-CN
source_dir: source
public_dir: public
theme: ayer
default_layout: post
new_post_name: :title.md
filename_case: 0
relative_link: false
pretty_urls:
  trailing_index: true
  trailing_html: true

per_page: 10
pagination_dir: page
archive_dir: archives
category_dir: categories
tag_dir: tags

archive_generator:
  per_page: 10
  yearly: true
  monthly: true
  daily: false

feed:
  type: atom
  path: atom.xml
  limit: 20
  hub:
  content: false

sitemap:
  path: sitemap.xml

baidusitemap:
  path: baidusitemap.xml

search:
  path: search.xml
  field: post
  content: true
  format: html

skip_render:
  - 404.html
  - CNAME
  - manifest.json
  - robots.txt
  - pCR.html
  - rhythm.html
  - about/index.html
  - schedule/index.html
  - trip/**/*.html
  # These are the original browser assets. Copy them byte-for-byte instead
  # of letting Hexo's template renderer interpret CSS/JS comments or braces.
  - css/**
  - js/**
  - dist/**
  - lib/**
  - assets/**
  - live2dw/**
  - images/**
  - articles/**

